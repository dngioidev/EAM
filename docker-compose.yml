# ─────────────────────────────────────────────────────────────────────────────
# Host-exposed ports (everything else is internal-only):
#   :80   → nginx         API gateway + Swagger
#   :3001 → wiki-app      Documentation viewer
#   :5050 → pgAdmin       Database admin UI
#   :5433 → postgres-test Test DB for host-side test runner (npm test)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: eam_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # No host port — access via pgAdmin (port 5050) or internal services
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eam_network

  postgres-test:
    image: postgres:15-alpine
    container_name: eam_postgres_test
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_TEST_PASSWORD}
      POSTGRES_DB: ${DATABASE_TEST_NAME}
    ports:
      - "5433:5432"             # Exposed: host test runner (npm test) needs this
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - eam_network

  redis:
    image: redis:7-alpine
    container_name: eam_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # No host port — internal only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eam_network

  # ── Database lifecycle services ────────────────────────────────────────────

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eam_migrate
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: postgres   # override .env localhost → Docker service name
      REDIS_HOST: redis
    command: ["npm", "run", "migration:run"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eam_network
    restart: "no"               # one-shot: run migrations then exit

  seed-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eam_seed_admin
    profiles: ["seed"]          # not started by default — run via: scripts/seed.ps1
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    command: ["npm", "run", "seed:admin"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eam_network
    restart: "no"               # one-shot: seed then exit

  # ── Application services ────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eam_backend
    env_file: ./backend/.env
    environment:
      # Override localhost values from .env with Docker service hostnames
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    # No host port — nginx routes /api/* to backend:3000 internally
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # wait for migrations before starting
    networks:
      - eam_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: eam_frontend
    # No host port — nginx routes / to frontend:80 internally
    networks:
      - eam_network
    restart: unless-stopped

  wiki:
    build:
      context: ./wiki-app
      dockerfile: Dockerfile
    container_name: eam_wiki
    ports:
      - "3001:3001"             # Exposed: documentation browser
    volumes:
      - ./wiki:/wiki:ro
    networks:
      - eam_network

  # ── Reverse proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: eam_nginx
    ports:
      - "80:80"                 # Single public entry point (API + frontend)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - eam_network
    restart: unless-stopped

  # ── Dev tooling ─────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: eam_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"   # Single-user desktop mode
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"               # Exposed: DB admin UI
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eam_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  eam_network:
    driver: bridge
