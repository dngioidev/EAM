# ─────────────────────────────────────────────────────────────────────────────
# EAM nginx reverse proxy — development configuration
#
# Port layout (host-exposed):
#   :80   → this nginx   (API + health — main entry point)
#   :3001 → wiki-app     (Next.js, separate for simplicity)
#   :5050 → pgAdmin      (DB admin UI)
#   :5433 → postgres-test (for host-side test runner)
#
# Internal only (no host port):
#   backend:3000, postgres:5432, redis:6379, frontend:5173 (profile)
# ─────────────────────────────────────────────────────────────────────────────

upstream backend {
    server backend:3000;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # Remove server version from responses
    server_tokens off;

    # Timeout / buffer tuning
    client_max_body_size 10m;
    proxy_read_timeout   60s;
    proxy_connect_timeout 10s;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # Enable keepalive to upstream

    # ── Backend REST API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
    }

    # ── Swagger UI (served by NestJS) ────────────────────────────────────────
    location /api/docs {
        proxy_pass http://backend;
    }

    # ── Health endpoint ──────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://backend;
    }

    # ── Root: environment info page (replaced by frontend when active) ───────
    location / {
        return 200 '{"service":"EAM Dev Gateway","endpoints":{"/api/v1/":"REST API","/api/docs":"Swagger UI","/health":"Health check"},"tools":{"wiki":"http://localhost:3001","pgAdmin":"http://localhost:5050"}}';
        add_header Content-Type application/json;
    }
}
